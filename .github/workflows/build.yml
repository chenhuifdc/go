name: Build Windows Binary

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o bin/whatsapp-ops.exe ./cmd/whatsapp-ops

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-ops-windows
          path: bin/whatsapp-ops.exe
          retention-days: 7